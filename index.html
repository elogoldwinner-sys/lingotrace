<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>LingoTrace</title>
    <!-- GitHub Pages SPA routing fix: restores the deep link encoded by 404.html -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- Self-heal after a new deploy: if a hashed /assets/ file from a stale cached page is gone (404), reload once to pick up the new index.html. -->
    <script type="text/javascript">
      (function () {
        var KEY = "lt-asset-reload";
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (!el || (el.tagName !== "LINK" && el.tagName !== "SCRIPT")) return;
            var url = el.href || el.src || "";
            if (url.indexOf("/assets/") === -1) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (err) {
              return;
            }
            var u = new URL(window.location.href);
            u.searchParams.set("_r", Date.now());
            window.location.replace(u.toString());
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () {
            try {
              sessionStorage.removeItem(KEY);
            } catch (err) {}
          }, 5000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
