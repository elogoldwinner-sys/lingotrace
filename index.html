<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LingoTrace" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>LingoTrace</title>
    <!-- GitHub Pages SPA routing fix: restores the deep link encoded by 404.html -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- One site, several installable apps (teacher / parent / student): pick the manifest for this page before the app loads. Keep in sync with src/lib/appIdentity.ts -->
    <script type="text/javascript">
      (function () {
        var p = location.pathname.replace(/\/+$/, "") || "/";
        var app = "default";
        if (p === "/portal-login" || /^\/portal\/parent(\/|$)/.test(p)) app = "parent";
        else if (/^\/portal\/student(\/|$)/.test(p)) app = "student";
        else if (p === "/school-login" || /^\/school(\/|$)/.test(p)) app = "school";
        else if (/^\/(login|dashboard|preferences|classes|students|attendance|sessions|archive|notes|projects|linked-activities)(\/|$)/.test(p)) app = "teacher";
        if (app === "default") return;
        var color = { teacher: "#36207C", parent: "#0F8B8D", student: "#EA580C", school: "#2563EB" }[app];
        var title = { teacher: "LT Teacher", parent: "LT Parents", student: "LT Students", school: "LT School" }[app];
        var m = document.querySelector('link[rel="manifest"]');
        if (m) m.setAttribute("href", "%BASE_URL%manifest-" + app + ".json");
        var t = document.querySelector('link[rel="apple-touch-icon"]');
        if (t) t.setAttribute("href", "%BASE_URL%icons/" + app + "-apple-touch.png");
        var c = document.querySelector('meta[name="theme-color"]');
        if (c) c.setAttribute("content", color);
        var a = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (a) a.setAttribute("content", title);
      })();
    </script>
    <!-- Self-heal after a new deploy: if a hashed /assets/ file from a stale cached page is gone (404), reload once to pick up the new index.html. -->
    <script type="text/javascript">
      (function () {
        var KEY = "lt-asset-reload";
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (!el || (el.tagName !== "LINK" && el.tagName !== "SCRIPT")) return;
            var url = el.href || el.src || "";
            if (url.indexOf("/assets/") === -1) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (err) {
              return;
            }
            var u = new URL(window.location.href);
            u.searchParams.set("_r", Date.now());
            window.location.replace(u.toString());
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () {
            try {
              sessionStorage.removeItem(KEY);
            } catch (err) {}
          }, 5000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
